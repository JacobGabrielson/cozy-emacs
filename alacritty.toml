# Font size: Cmd+- / Cmd+= / Cmd+0 are Alacritty's own defaults, carved back
# out of the Cmd-as-Meta bindings below. Nothing is lost: Option is Meta too
# (option_as_alt = "Both"), so Opt+- and Opt+= still send M-- and M-=.
[[keyboard.bindings]]
key = "-"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "="
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "`"
mods = "Command"
chars = "\u001B`"

# M-< beginning-of-buffer
[[keyboard.bindings]]
key = ","
mods = "Command|Shift"
chars = "\u001B<"

# M-> end-of-buffer
[[keyboard.bindings]]
key = "."
mods = "Command|Shift"
chars = "\u001B>"

# M-?
[[keyboard.bindings]]
key = "/"
mods = "Command|Shift"
chars = "\u001B?"

# M-: eval-expression
[[keyboard.bindings]]
key = ";"
mods = "Command|Shift"
chars = "\u001B:"

# M-! shell-command
[[keyboard.bindings]]
key = "1"
mods = "Command|Shift"
chars = "\u001B!"

# M-$ ispell-word
[[keyboard.bindings]]
key = "4"
mods = "Command|Shift"
chars = "\u001B$"

# M-% query-replace
[[keyboard.bindings]]
key = "5"
mods = "Command|Shift"
chars = "\u001B%"

# M-_
[[keyboard.bindings]]
key = "-"
mods = "Command|Shift"
chars = "\u001B_"

# M-+
