[cursor.style]
shape = "Block"
blinking = "Never"

[colors.cursor]
cursor = "#ff0000"
text = "CellBackground"

[window]
# Both Option keys send Alt (= Meta in Emacs). Command is *also* Meta now, via
# the explicit bindings at the bottom of this file — Alacritty has no
# "command_as_alt" knob, so every chord has to be spelled out. Net effect: two
# Meta keys, and Cmd+Q / Cmd+W / Cmd+C / Cmd+V no longer reach macOS. Copy and
# paste moved to Cmd+Shift+C / Cmd+Shift+V.
option_as_alt = "Both"

# Send 0x1F (= C-_) for Ctrl+/ so Emacs `undo' works. Alacritty doesn't
# generate any byte for Ctrl+/ by default, so nothing reaches Emacs without
# this binding.
[[keyboard.bindings]]
key = "Slash"
mods = "Control"
chars = "\u001F"

# Silence Alacritty's own bell (visual flash on BEL byte). Note: the macOS
# system UI sound for unhandled keys is *not* configurable here — disable
# that via System Settings → Sound → "Play user interface sound effects",
# or via `defaults write -g com.apple.sound.uiaudio.enabled -int 0`.
[bell]
duration = 0
command = "None"

[font]
size = 13
[font.normal]
family = "JetBrainsMono Nerd Font"

# ===========================================================================
# Command as Meta
# ===========================================================================
# --- Clipboard: the only Cmd chords NOT turned into Meta. ---
# Cmd+Shift+C copies, Cmd+Shift+V pastes. Chosen because M-C and M-V
# (shifted) are near-unused in Emacs, unlike M-c / M-v.

[[keyboard.bindings]]
key = "C"
mods = "Command|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command|Shift"
action = "Paste"

