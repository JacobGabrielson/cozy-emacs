key = "="
mods = "Command|Shift"
chars = "\u001B+"

# M-~
[[keyboard.bindings]]
key = "`"
mods = "Command|Shift"
chars = "\u001B~"

# M-DEL backward-kill-word
[[keyboard.bindings]]
key = "Backspace"
mods = "Command"
chars = "\u001B\u007F"

